[package]
name = "uttt_frontend"
version = "0.1.0"
authors = ["festivity <nrk139@gmail.com>"]
edition = "2018"

# Generated based on https://github.com/zupzup/rust-frontend-example-yew/blob/main/Cargo.toml

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yew = "0.18"
wasm-bindgen = "0.2.67"
serde = "1"
serde_derive = "1"
serde_json = "1"
anyhow = "1"
yew-router = "0.15.0"